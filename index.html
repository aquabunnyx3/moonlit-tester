<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonlit Meadows — Story &amp; Feature Tester</title>
<style>
  :root{
    --ink:#463a54; --cream:#fff8ee; --paper:#fffdf8; --pink:#f9c6d3; --pinkdeep:#f6a9be;
    --rose:#e8829c; --lav:#e4d9f7; --lavdeep:#cdbef3; --lilac:#a08cd2; --gold:#f5c95b;
    --green:#9ccb86; --bad:#b08968;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; background:#2c2440; color:var(--ink)}
  #app{max-width:520px; margin:0 auto; min-height:100vh; background:#fdf3f7; display:flex; flex-direction:column}
  header{padding:10px 14px 6px; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  header h1{font-size:17px; margin:0 6px 0 0}
  .badge{background:var(--lav); border:2px solid var(--lilac); border-radius:999px; padding:2px 10px; font-size:12.5px; font-weight:700}
  .badge.moon{background:#3a2f5e; color:#ffe9a8; border-color:#6b5aa8}
  .badge.coins{background:#fff0c2; border-color:var(--gold)}
  #sceneWrap{position:relative; margin:6px 10px 0; border-radius:22px; overflow:hidden; border:3px solid var(--lilac); background:#1c1830; aspect-ratio:16/10}
  #sceneImg{width:100%; height:100%; object-fit:cover; display:block}
  #sceneWrap.night #sceneImg{filter:brightness(.62) saturate(1.05) hue-rotate(-8deg)}
  .hotspot{position:absolute; transform:translate(-50%,-100%); background:rgba(255,248,238,.95); border:2.5px solid var(--rose);
    color:var(--ink); border-radius:999px; padding:6px 12px; font-size:13.5px; font-weight:800; cursor:pointer; box-shadow:0 3px 10px rgba(30,10,50,.35); white-space:nowrap}
  .hotspot:active{transform:translate(-50%,-100%) scale(.95)}
  .hotspot.bunny{border-color:var(--gold); background:#fffbe8; animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{margin-top:0}50%{margin-top:-6px}}
  #panel{flex:1; margin:10px; background:var(--paper); border:3px solid var(--lilac); border-radius:22px; padding:14px; overflow-y:auto}
  #panel h2{margin:2px 0 8px; font-size:17px}
  #panel p{margin:6px 0; line-height:1.45; font-size:15px}
  .btn{display:block; width:100%; text-align:left; background:var(--lav); border:2.5px solid var(--lilac); color:var(--ink);
    border-radius:16px; padding:11px 14px; font-size:15.5px; font-weight:700; margin:7px 0; cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.pink{background:var(--pink); border-color:var(--rose)}
  .btn.gold{background:#ffedb5; border-color:var(--gold)}
  .btn.quiet{background:#efeaf6}
  .btn.rude{background:#e9e2da; border-color:var(--bad)}
  .btn:disabled{opacity:.45}
  .btn .sub{display:block; font-weight:500; font-size:13px; opacity:.75}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
  .chip{background:var(--cream); border:2px solid var(--lilac); border-radius:999px; padding:3px 10px; font-size:13px; font-weight:700}
  .medallion{display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%;
    font-size:21px; border:2.5px solid var(--lilac); vertical-align:middle; margin-right:8px}
  #dialog{display:none}
  #dialog .who{font-weight:900; font-size:14px; letter-spacing:.04em; text-transform:uppercase}
  #dialog .line{font-size:16.5px; line-height:1.5; margin:8px 0 4px; white-space:pre-wrap}
  #tabs{display:flex; gap:6px; padding:0 10px 12px}
  #tabs button{flex:1; background:var(--lav); border:2.5px solid var(--lilac); border-radius:14px; padding:9px 2px;
    font-size:13.5px; font-weight:800; color:var(--ink); cursor:pointer}
  #tabs button.on{background:var(--pink); border-color:var(--rose)}
  #toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:86px; max-width:92vw; background:var(--ink); color:#fff;
    padding:11px 16px; border-radius:16px; font-size:14.5px; line-height:1.4; opacity:0; pointer-events:none; transition:all .3s; z-index:50; box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #meterWrap{display:none; margin-top:10px}
  #meter{position:relative; height:38px; border-radius:12px; background:#4a4266; border:2.5px solid var(--lilac); overflow:hidden}
  #zoneGreen{position:absolute; top:0; bottom:0; background:#7ed491}
  #zoneGold{position:absolute; top:0; bottom:0; background:var(--gold)}
  #marker{position:absolute; top:-2px; bottom:-2px; width:6px; background:#fff; border-radius:3px; box-shadow:0 0 8px #fff}
  .stars{color:#d8a03c; letter-spacing:1px}
  .fishgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px}
  .fishcell{background:var(--cream); border:2px solid var(--lilac); border-radius:14px; padding:8px 6px; text-align:center; font-size:12.5px}
  .fishcell .big{font-size:26px}
  .fishcell.unknown{opacity:.55; filter:grayscale(1)}
  .check{line-height:1.9; font-size:15px}
  .small{font-size:13px; opacity:.75}
  .rowbtns{display:flex; gap:6px} .rowbtns .btn{margin:4px 0}
  hr.sep{border:none; border-top:2px dashed var(--lav); margin:12px 0}
</style>
</head>

let S;
try { S = JSON.parse(localStorage.getItem("mm-tester-v1")) || DEFAULTS(); } catch(e) { S = DEFAULTS(); }
function save(){ localStorage.setItem("mm-tester-v1", JSON.stringify(S)); }
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function toast(msg, ms){ const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove("show"), ms||4600); }
function momentOnce(id, text){ if(!S.moments.includes(id)){ S.moments.push(id); toast("✨ Moment: " + text); } }

// ---------- rules ----------
const isFullMoon = () => S.day % 8 === 7;
function stageIdx(points){ let i = 0; STAGES.forEach((s,j)=>{ if(points >= s[1]) i = j; }); return i; }
function stageName(pid){ let i = stageIdx(S.rel[pid].points);
  if(pid === "theo" && !S.flags.revealDone && i > 3) i = 3; return STAGES[i][0]; }
function gainPoints(pid, raw){ let amt = raw;
  if(pid === "theo" && !S.flags.revealDone) amt = Math.round(raw * 0.6);
  S.rel[pid].points = Math.min(1020, S.rel[pid].points + amt); return amt; }
const revealReady = () => S.flags.capsuleOpened && !S.flags.revealDone && S.rel.theo.points >= 380;
const finaleReady = () => S.flags.revealDone && !S.flags.finaleDone && isFullMoon();
function bunnyPlace(){ if(S.flags.finaleDone || !S.night || S.weather !== "sunny" || S.bunnyGoneDay === S.day) return null;
  if(revealReady() || finaleReady()) return "pondDock";
  return ["pondShore","farmGate","pondShore","farmTree"][S.day % 4]; }
function fishItem(id){ return DATA.fish.find(f=>f.id===id); }
function itemName(id){ if(id.startsWith("fish-")){ const f = fishItem(id.slice(5)); return f ? f.name : id; }
  if(id.startsWith("seed-")){ const c = ITEMS[id.slice(5)]; return c ? c.name + " Seeds" : id; }
  return ITEMS[id] ? ITEMS[id].name : id; }
function itemEmoji(id){ if(id.startsWith("fish-")) return "🐟"; if(id.startsWith("seed-")) return "🌱";
  return ITEMS[id] ? ITEMS[id].emoji : "🎁"; }
function sellValue(id){ if(id.startsWith("fish-")){ const f = fishItem(id.slice(5)); return f ? f.value : 0; }
  return ITEMS[id] ? ITEMS[id].sell : 0; }
const hasFish = () => Object.keys(S.inv).some(k=>k.startsWith("fish-") && S.inv[k] > 0);
function addItem(id, n){ S.inv[id] = (S.inv[id]||0) + n; if(S.inv[id] <= 0) delete S.inv[id]; }

// ---------- dialog ----------
let dlg = null;
function showLines(who, lines, opts){
  dlg = { who: who, pairs: lines.map(l => Array.isArray(l) ? l : [who, l]), idx: 0,
          answers: (opts && opts.answers) || null, onAnswer: opts && opts.onAnswer,
          note: (opts && opts.note) || "", onDone: (opts && opts.onDone) || null };
  renderDialog();
}
function renderDialog(){
  const p = $("panel"); if(!dlg) return;
  const pair = dlg.pairs[Math.min(dlg.idx, dlg.pairs.length - 1)];
  const speaker = pair[0] || dlg.who;
  let h = '<div id="dialog" style="display:block"><div class="who">' + esc(speaker === "" ? "✦" : speaker) + '</div>' +
          '<div class="line">' + esc(pair[1]) + '</div>';
  const last = dlg.idx >= dlg.pairs.length - 1;
  if(last && dlg.answers){
    dlg.answers.forEach((a,i)=>{ h += '<button class="btn ' + (a.rude ? "rude" : "pink") + '" onclick="dlgAnswer(' + i + ')">' + esc(a.text) + '</button>'; });
  } else if(!last){
    h += '<button class="btn pink" onclick="dlgNext()">Next ▸</button>';
  } else {
    if(dlg.note) h += '<p class="small">' + esc(dlg.note) + '</p>';
    h += '<button class="btn" onclick="dlgClose()">Done</button>';
  }
  p.innerHTML = h + '</div>';
}
function dlgNext(){ dlg.idx++; renderDialog(); }
function dlgAnswer(i){ const f = dlg && dlg.onAnswer; dlg = null; if(f) f(i); }
function dlgClose(){ const f = dlg && dlg.onDone; dlg = null; render(); if(f) f(); }

// ---------- talking & gifts ----------
function dailyLine(pid){
  if(pid === "theo" && S.weather === "rainy"){
    const pool = S.flags.revealDone ? THEO_RAIN_WARM : THEO_RAIN_SHUT; return pool[S.day % pool.length]; }
  const pool = stageIdx(S.rel[pid].points) >= 2 ? DATA.people[pid].friend : DATA.people[pid].early;
  return pool[S.day % pool.length];
}
function talkTo(pid){
  const P = DATA.people[pid], R = S.rel[pid], name = DATA.meta[pid].name;
  if(pid === "theo" && !S.flags.revealDone && S.weather === "rainy"){
    return showLines("Theo", [THEO_RAIN_SHUT[S.day % 2]], {note:"Rain does something to him — he won't talk today, and the day isn't used up. (Story rule: Theo before the Reveal.)"});
  }
  if(R.lastTalk === S.day) return showLines(name, ["(You've already chatted with " + name + " today. Once a day, like the game.)"]);
  R.lastTalk = S.day;
  const line = dailyLine(pid);
  momentOnce("firstChat", "First chat — talking once a day grows a friendship.");
  let fishyNote = "";
  if(pid === "theo" && !S.flags.fishyPending && !S.flags.fishyDone){
    S.flags.fishyPending = true;
    fishyNote = "📜 Something Fishy: Theo kept circling back to the pond fish. Bring him a fish — any fish — and see what he says.";
  }
  const qs = (P.questions || []).filter(q => R.choices[q.id] === undefined);
  if(S.day % 2 === 0 && stageIdx(R.points) >= 1 && qs.length){
    const q = qs[0];
    const g0 = gainPoints(pid, 10); save();
    return showLines(name, [line, q.prompt], { answers: q.answers, onAnswer: i => {
      const a = q.answers[i]; R.choices[q.id] = i;
      const g = gainPoints(pid, a.points);
      const best = Math.max(...q.answers.filter(x=>!x.rude).map(x=>x.points));
      if(a.rude) R.warmth -= 1; else if(a.points >= best) R.warmth += 1;
      save();
      showLines(name, [a.response], { note: "+" + g0 + " for chatting" + (g ? " · +" + g + " for your answer" : "") + (a.rude ? " · warmth −1 💔" : "") , onDone: checkFragments });
    }});
  }
  const g = gainPoints(pid, 10); save();
  showLines(name, [line], { note: "+" + g + " friendship" + (fishyNote ? "\n" + fishyNote : ""), onDone: checkFragments });
}
function checkFragments(){
  if(dlg) return;
  const i = stageIdx(S.rel.theo.points);
  const earned = i >= 3 ? 3 : i >= 2 ? 2 : i >= 1 ? 1 : 0;
  if(S.flags.fragments < earned){
    S.flags.fragments += 1; save();
    const lines = FRAGMENTS[S.flags.fragments - 1].map(t => ["", t]);
    showLines("", lines, { note: "✦ Memory fragment " + S.flags.fragments + " of 3", onDone: checkFragments });
  } else render();
}
function reactionTo(pid, item){
  const P = DATA.meta[pid];
  if(pid === "theo" && !S.flags.revealDone) return (item.includes("moon") || item.includes("bunny")) ? "loved" : "neutral";
  if((P.loved||[]).includes(item)) return "loved";
  if((P.liked||[]).includes(item)) return "liked";
  if((P.disliked||[]).includes(item)) return "disliked";
  return "neutral";
}
function giveGift(pid){
  const R = S.rel[pid], name = DATA.meta[pid].name;
  if(R.lastGift === S.day) return showLines(name, ["(One gift a day — " + name + " has yours already.)"]);
  const items = Object.keys(S.inv).filter(k => S.inv[k] > 0);
  if(!items.length) return showLines(name, ["(Your pockets are empty — catch a fish or harvest something first.)"]);
  const p = $("panel");
  let h = '<div id="dialog" style="display:block"><div class="who">Give ' + esc(name) + '…</div>';
  items.forEach(id => { h += '<button class="btn" onclick="doGift(\'' + pid + '\',\'' + id + '\')">' + itemEmoji(id) + ' ' + esc(itemName(id)) + ' ×' + S.inv[id] + '</button>'; });
  h += '<button class="btn quiet" onclick="render()">Never mind</button></div>';
  p.innerHTML = h;
}
function doGift(pid, id){
  const R = S.rel[pid], name = DATA.meta[pid].name;
  addItem(id, -1); R.lastGift = S.day;
  const mood = reactionTo(pid, id);
  const pts = {loved:40, liked:20, neutral:8, disliked:0}[mood];
  const g = gainPoints(pid, pts);
  R.warmth += {loved:2, liked:1, neutral:0, disliked:-1}[mood];
  momentOnce("firstGift", "First gift given — everyone has favorites.");
  save();
  const label = {loved:"💖 Loved it!", liked:"💛 Liked it", neutral:"🤍 A polite thanks", disliked:"💔 Disliked…"}[mood];
  showLines(name, [DATA.meta[pid].reactions[mood]], { note: label + (g ? " · +" + g + " friendship" : ""), onDone: checkFragments });
}
function giveTheoFish(){
  const id = Object.keys(S.inv).find(k => k.startsWith("fish-") && S.inv[k] > 0);
  if(!id) return;
  addItem(id, -1); S.flags.fishyPending = false; S.flags.fishyDone = true;
  const g = gainPoints("theo", 20); save();
  showLines("Theo", ["…You actually brought one. " + itemName(id) + ". Nonno used to say the pond keeps what the village throws away. …Forget I said that."],
    { note: "📜 Something Fishy — complete · +" + g + " friendship", onDone: checkFragments });
}

// ---------- the Moon Bunny & the capsule ----------
function interactBunny(){
  S.bunnyGoneDay = S.day; S.flags.metMoonBunny = true; S.flags.sightings += 1;
  if(finaleReady()){
    S.flags.finaleDone = true;
    S.keepsakes = S.keepsakes.filter(k => k !== "capsulePhoto");
    if(!S.keepsakes.includes("capsulePhotoClear")) S.keepsakes.push("capsulePhotoClear");
    if(!S.keepsakes.includes("mochiCharmHalf")) S.keepsakes.push("mochiCharmHalf");
    save(); return showLines("", FINALE, { note: "🌕 The Full-Moon Goodbye — the story is complete. The charm halves are whole again." });
  }
  if(revealReady()){
    S.flags.revealDone = true; save();
    return showLines("", REVEAL, { note: "💧 The Night at the Pond — Theo's track is open now: full points, honest gifts, warm rain lines." });
  }
  const n = S.flags.sightings;
  if(n === 1){ S.keepsakes.push("kidRibbon"); momentOnce("firstMoonBunny", "A bunny that only comes out under the moon…"); }
  if(n === 2 && !S.keepsakes.includes("smoothStone")) S.keepsakes.push("smoothStone");
  if(n === 3 && !S.keepsakes.includes("pressedFlower")) S.keepsakes.push("pressedFlower");
  save();
  showLines("", [SIGHTING_TOASTS[n] || "🐰 The white bunny watched you a while, then hopped off into the moonlight."],
    { note: "Sighting " + n + " · clear nights only · where she appears rotates by day" });
}
function digCapsule(){
  S.flags.capsuleOpened = true;
  S.keepsakes.push("theoCharmHalf", "capsulePhoto"); save();
  showLines("", ["📦 Under the shore stones: a buried time capsule. Kid drawings, a blurred photo… and half of a carved wooden moon. Theo would know about this. Theo would know everything about this."],
    { note: "The Reveal is armed: it waits for a clear night with Theo at " + S.rel.theo.points + "/380 friendship." });
}

// ---------- fishing ----------
let fishing = null;
function fishPool(){
  return DATA.fish.filter(f => { const c = f.conds;
    if(c.includes("fullMoon") && !(isFullMoon() && S.night)) return false;
    if(c.includes("rain") && S.weather !== "rainy") return false;
    const dayF = c.includes("day"), nightF = c.includes("night") || c.includes("duskOnly");
    if(dayF && !nightF && S.night) return false;
    if(nightF && !dayF && !S.night) return false;
    if(f.id === "old-dockmaster" && S.fishBook[f.id]) return false;
    return true; });
}
function rollFish(){
  const pool = fishPool(); if(!pool.length) return null;
  const tiers = ["common","uncommon","rare","epic","legendary"], w = [62,24,9,4,1];
  let r = Math.random() * 100, tier = "common";
  for(let i = 0; i < 5; i++){ if(r < w[i]){ tier = tiers[i]; break; } r -= w[i]; }
  let cands = pool.filter(f => f.rarity === tier); if(!cands.length) cands = pool;
  return cands[Math.floor(Math.random() * cands.length)];
}
function startFishing(){
  const f = rollFish();
  if(!f) return toast("Nothing's biting in these conditions.");
  fishing = { fish: f, phase: "wait" };
  const p = $("panel");
  p.innerHTML = '<div id="dialog" style="display:block"><div class="who">🎣 Fishing</div>' +
    '<div class="line">You cast from the dock. The bobber settles…</div><p class="small">Waiting for a bite (2–6 s, like the game)…</p></div>';
  setTimeout(() => { if(!fishing) return; fishing.phase = "meter"; fishing.t0 = performance.now(); renderMeter(); loopMeter(); },
    2000 + Math.random() * 4000);
}
function renderMeter(){
  const m = METER[fishing.fish.rarity];
  const gc = 46, oc = 88;
  const p = $("panel");
  p.innerHTML = '<div id="dialog" style="display:block"><div class="who">❗ A bite!</div>' +
    '<div class="line">Stop the marker: gold = Perfect, green = catch. It sweeps back and forth — no timeout, like the game.</div>' +
    '<div id="meterWrap" style="display:block"><div id="meter">' +
    '<div id="zoneGreen" style="left:' + (gc - m.g * 50) + '%;width:' + (m.g * 100) + '%"></div>' +
    '<div id="zoneGold" style="left:' + (oc - m.gold * 50) + '%;width:' + (m.gold * 100) + '%"></div>' +
    '<div id="marker" style="left:0%"></div></div></div>' +
    '<button class="btn pink" onclick="stopMeter()">🎣 Stop!</button></div>';
}
function loopMeter(){
  if(!fishing || fishing.phase !== "meter") return;
  const m = METER[fishing.fish.rarity];
  const t = (performance.now() - fishing.t0) / 1000 * m.s;
  const frac = t % 2, pos = frac < 1 ? frac : 2 - frac;
  fishing.pos = pos;
  const mk = $("marker"); if(mk) mk.style.left = (pos * 100) + "%";
  requestAnimationFrame(loopMeter);
}
function stopMeter(){
  if(!fishing || fishing.phase !== "meter") return;
  const f = fishing.fish, m = METER[f.rarity], pos = fishing.pos;
  fishing = null;
  const inGold = Math.abs(pos - 0.88) <= m.gold / 2, inGreen = Math.abs(pos - 0.46) <= m.g / 2;
  if(inGold || inGreen){
    addItem("fish-" + f.id, 1);
    const isNew = !S.fishBook[f.id]; S.fishBook[f.id] = true;
    let note = "Fish book: " + Object.keys(S.fishBook).length + "/50" + (isNew ? " · NEW!" : "");
    let line = "Caught a " + f.name + "! (" + f.value + " coins at the shop)";
    if(inGold){ const bonus = Math.round(f.value * 0.5); S.coins += bonus; line = "⭐ PERFECT! A " + f.name + "! The pond pays a +" + bonus + " coin bonus on the spot."; note += " · perfect bonus paid"; }
    momentOnce("firstFish", "First fish caught!");
    save();
    showLines("", [line], { note: note });
  } else {
    showLines("", ["It slipped away… the ones that get away teach you the timing."], { note: "Green is centered at 46%, gold at 88% — same as the game." });
  }
}
</script>
<script>
"use strict";
// ---------- places & rendering ----------
const PLACES = {
  farm: { img:"farm", name:"Your Farm", desc:"Home. The pond path leaves from the north edge; the village path from the south." },
  pond: { img:"pond", name:"The Pond", desc:"The old dock, the shore stones, and still black water. A lot happened here, a long time ago." },
  village: { img:"village", name:"The Village", desc:"The plaza, the Glasshouse, and the Village Shop with its counter." },
  shop: { img:"shop", name:"The Village Shop", desc:"Shelves of jars and produce, a brass bell on the counter — and Bree behind it." }
};
function go(place){ S.place = place; S.tab = "places"; dlg = null; fishing = null; save(); render(); }
function headerRender(){
  $("dayBadge").textContent = "Day " + S.day + (S.night ? " · Night" : " · Day");
  const w = WEATHERS[S.weather]; $("weatherBadge").textContent = w[0] + " " + w[1];
  $("moonBadge").textContent = S.night ? (isFullMoon() ? "🌕 Full moon tonight" : "🌙 Night") : "☀️ Daytime";
  $("moonBadge").style.display = S.night ? "" : "none";
  $("coinBadge").textContent = "🪙 " + S.coins;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
}
function sceneRender(){
  const pl = PLACES[S.place];
  $("sceneImg").src = IMG[pl.img];
  $("sceneWrap").classList.toggle("night", S.night);
  const bp = bunnyPlace();
  let spots = [];
  const spot = (x, y, label, fn, cls) => '<button class="hotspot ' + (cls||"") + '" style="left:' + x + '%;top:' + y + '%" onclick="' + fn + '">' + label + '</button>';
  if(S.place === "farm"){
    spots.push(spot(30, 96, "🚶 North path → Pond", "go('pond')"));
    spots.push(spot(72, 96, "🚶 South path → Village", "go('village')"));
    if(bp === "farmGate") spots.push(spot(50, 88, "🐰 A white bunny…", "interactBunny()", "bunny"));
    if(bp === "farmTree") spots.push(spot(86, 30, "🐰 A white bunny…", "interactBunny()", "bunny"));
  }
  if(S.place === "pond"){
    spots.push(spot(16, 96, "↩ Back to the farm", "go('farm')"));
    spots.push(spot(50, 62, "🎣 The dock — fish", "startFishing()"));
    if(bp === "pondShore") spots.push(spot(64, 82, "🐰 A white bunny…", "interactBunny()", "bunny"));
    if(bp === "pondDock") spots.push(spot(50, 76, "🐰 The white bunny is waiting…", "interactBunny()", "bunny"));
    if(S.flags.fragments >= 2 && !S.flags.capsuleOpened) spots.push(spot(78, 88, "🪨 Loose shore stones", "digCapsule()"));
  }
  if(S.place === "village"){
    spots.push(spot(14, 96, "↩ Farm", "go('farm')"));
    spots.push(spot(74, 58, "🏪 Village Shop", "go('shop')"));
  }
  if(S.place === "shop"){
    spots.push(spot(50, 97, "🚪 Leave the shop", "go('village')"));
  }
  $("hotspots").innerHTML = spots.join("");
}
function personCard(pid){
  const M = DATA.meta[pid], R = S.rel[pid];
  const hearts = "♥".repeat(Math.max(0, Math.min(5, 3 + R.warmth))) + "♡".repeat(Math.max(0, 5 - Math.max(0, Math.min(5, 3 + R.warmth))));
  let extra = "";
  if(pid === "theo"){
    extra = '<p class="small">Theo\'s track: ' + (S.flags.revealDone ? "open (the Reveal happened)" : "guarded — gains at 60%, gifts flat unless they mention the moon or bunnies, no talking in the rain") + '</p>';
    if(S.flags.fishyPending && hasFish()) extra += '<button class="btn gold" onclick="giveTheoFish()">🐟 Give Theo a fish (Something Fishy)</button>';
    else if(S.flags.fishyPending) extra += '<p class="small">📜 Something Fishy: bring Theo a fish.</p>';
    if(S.flags.fishyDone) extra += '<p class="small">📜 Something Fishy ✓</p>';
  }
  return '<h2><span class="medallion" style="background:' + META[pid].color + '">' + META[pid].emoji + '</span>' + esc(M.name) + '</h2>' +
    '<p class="small">' + esc(M.role) + '</p>' +
    '<p>' + stageName(pid) + ' · ' + R.points + ' pts · <span class="stars">' + hearts + '</span></p>' + extra +
    '<div class="rowbtns"><button class="btn pink" onclick="talkTo(\'' + pid + '\')">💬 Chat</button>' +
    '<button class="btn" onclick="giveGift(\'' + pid + '\')">🎁 Gift</button></div><hr class="sep">';
}
function renderPlaces(){
  const pl = PLACES[S.place], p = $("panel");
  let h = "<h2>" + pl.name + "</h2><p>" + pl.desc + "</p>";
  if(S.place === "farm"){
    h += '<button class="btn" onclick="harvest()">🌾 Tend the farm<span class="sub">Harvest a small crop (arms the First Sale, like the game)</span></button>';
    h += '<button class="btn" onclick="sleep()">🛏️ Sleep<span class="sub">End the day — weather rolls again, chats refresh</span></button>';
    h += '<button class="btn" onclick="toggleNight()">' + (S.night ? "☀️ Back to daytime" : "🌙 Skip to night") + '</button>';
  }
  if(S.place === "pond"){
    h += '<button class="btn pink" onclick="startFishing()">🎣 Fish from the dock</button>';
    if(bunnyPlace() === "pondDock" && (revealReady() || finaleReady()))
      h += '<p class="small">Theo is standing at the shore tonight, saying nothing. The bunny is waiting at the dock.</p>';
    if(S.flags.fragments >= 2 && !S.flags.capsuleOpened)
      h += '<button class="btn gold" onclick="digCapsule()">🪨 Dig under the loose shore stones</button>';
  }
  if(S.place === "village"){
    h += personCard("june") + personCard("theo");
    h += '<p class="small">Bree is at the Village Shop — her counter has Chat / Buy / Sell, just like the game.</p>';
  }
  if(S.place === "shop"){
    h += '<h2><span class="medallion" style="background:' + META.bree.color + '">' + META.bree.emoji + '</span>Bree · Village Shop</h2>' +
      '<p>“Oh! Hi hi. Come to browse, or come to talk?”</p>' +
      '<button class="btn pink" onclick="talkTo(\'bree\')">💬 Chat</button>' +
      '<button class="btn" onclick="renderBuy()">🛒 Buy seeds</button>' +
      '<button class="btn" onclick="renderSell()">💰 Sell</button>' +
      '<button class="btn quiet" onclick="go(\'village\')">🚪 Exit</button>';
  }
  p.innerHTML = h;
}
function renderBuy(){
  let h = "<h2>🛒 Bree's seeds</h2><p class='small'>Real seed prices from the game. Coins: 🪙 " + S.coins + "</p>";
  SEEDS.forEach(([id, price]) => {
    h += '<button class="btn" ' + (S.coins < price ? "disabled" : "") + ' onclick="buySeed(\'' + id + '\',' + price + ')">🌱 ' + esc(ITEMS[id].name) + ' Seeds — 🪙 ' + price + '<span class="sub">You hold ' + (S.inv["seed-" + id] || 0) + '</span></button>';
  });
  h += '<button class="btn quiet" onclick="render()">← Back to the counter</button>';
  $("panel").innerHTML = h;
}
function buySeed(id, price){
  if(S.coins < price) return;
  S.coins -= price; addItem("seed-" + id, 1);
  momentOnce("firstPurchase", "First purchase at the shop!");
  save(); renderBuy(); headerRender();
}
function renderSell(){
  const sellable = Object.keys(S.inv).filter(k => S.inv[k] > 0 && sellValue(k) > 0);
  let h = "<h2>💰 Sell to Bree</h2>";
  if(!sellable.length) h += "<p class='small'>Nothing sellable — crops and fish sell; seeds and muffins don't.</p>";
  sellable.forEach(id => {
    h += '<button class="btn" onclick="sellItem(\'' + id + '\')">' + itemEmoji(id) + ' ' + esc(itemName(id)) + ' ×' + S.inv[id] + ' — 🪙 ' + sellValue(id) + ' each</button>';
  });
  if(S.flags.firstSalePending && !S.flags.firstSaleDone) h += "<p class='small'>🌟 Your first harvest is ready to sell — the First Sale bonus (+20) is armed.</p>";
  h += '<button class="btn quiet" onclick="render()">← Back to the counter</button>';
  $("panel").innerHTML = h;
}
function sellItem(id){
  addItem(id, -1); S.coins += sellValue(id);
  if(S.flags.firstSalePending && !S.flags.firstSaleDone){
    S.flags.firstSalePending = false; S.flags.firstSaleDone = true; S.coins += 20;
    toast("🌟 First Sale! +20 bonus coins — the meadow provides.");
  }
  momentOnce("firstSale", "First sale at the shop!");
  save(); renderSell(); headerRender();
}
function harvest(){
  addItem("strawberry", 2);
  if(!S.flags.firstSaleDone && !S.flags.firstSalePending){ S.flags.firstSalePending = true; toast("🌱 Harvested! Sell a crop at Bree's to complete the First Sale (+20)."); }
  else toast("🌱 Harvested 2 strawberries.");
  save(); render();
}
function toggleNight(){
  S.night = !S.night;
  if(S.night) momentOnce("firstEvening", "First evening in the meadow.");
  save(); render();
}
function sleep(){
  S.day += 1; S.night = false; S.place = "farm";
  const r = Math.random();
  S.weather = r < 0.55 ? "sunny" : r < 0.75 ? "cloudy" : r < 0.9 ? "breezy" : "rainy";
  if(S.weather === "rainy") momentOnce("firstRain", "First rainy day.");
  save(); render();
  toast("🌅 Day " + S.day + " — " + WEATHERS[S.weather][1] + (isFullMoon() ? " · 🌕 full moon tonight" : ""));
}
function renderPeople(){ $("panel").innerHTML = "<h2>People</h2>" + personCard("theo") + personCard("bree") + personCard("june") +
  '<p class="small">Chatting is once a day (+10, Theo +6 before the Reveal). On even days, at Acquaintance or better, they may ask you a question — answer buttons included, rude answer and all.</p>'; }
function renderJournal(){
  const F = S.flags, ck = b => b ? "✅" : "⬜";
  let h = "<h2>📖 Journal — story progress</h2><div class='check'>" +
    ck(F.metMoonBunny) + " Met the Moon Bunny (clear nights; her spot rotates by day)<br>" +
    ck(F.sightings >= 3) + " Sightings: " + F.sightings + "/3 keepsake visits<br>" +
    ck(F.fragments >= 3) + " Memory fragments: " + F.fragments + "/3 (Theo at Acquaintance / Friend / Close Friend)<br>" +
    ck(F.capsuleOpened) + " Time capsule dug up (needs 2+ fragments, at the pond)<br>" +
    ck(F.revealDone) + " The Reveal — clear night, capsule open, Theo ≥ 380 pts<br>" +
    ck(F.finaleDone) + " The Full-Moon Goodbye (full moon = every 8th night: days 7, 15, 23…)<br>" +
    ck(F.fishyDone) + " Something Fishy (bring Theo any fish)<br>" +
    ck(F.firstSaleDone) + " First Sale (+20 bonus)</div><hr class='sep'><h2>Keepsakes</h2>";
  h += S.keepsakes.length ? '<div class="chips">' + S.keepsakes.map(k => '<span class="chip">' + KEEPSAKES[k] + '</span>').join("") + "</div>" : "<p class='small'>None yet.</p>";
  h += "<hr class='sep'><h2>Pockets</h2>";
  const inv = Object.keys(S.inv).filter(k => S.inv[k] > 0);
  h += inv.length ? '<div class="chips">' + inv.map(k => '<span class="chip">' + itemEmoji(k) + " " + esc(itemName(k)) + " ×" + S.inv[k] + "</span>").join("") + "</div>" : "<p class='small'>Empty.</p>";
  h += "<hr class='sep'><h2>Moments</h2><p class='small'>" + (S.moments.length ? S.moments.join(" · ") : "None yet — chat, gift, fish, buy, stay out at night…") + "</p>";
  $("panel").innerHTML = h;
}
function renderFish(){
  const got = Object.keys(S.fishBook).length;
  let h = "<h2>🐟 Fish Book — " + got + "/50</h2><p class='small'>The real 50, with the game's conditions: day/night, rain, dusk (treated as night here), and full-moon-only legends. The Old Dockmaster can only be caught once.</p><div class='fishgrid'>";
  DATA.fish.forEach(f => {
    const known = S.fishBook[f.id];
    h += '<div class="fishcell' + (known ? "" : " unknown") + '"><div class="big">' + (known ? "🐟" : "❓") + '</div>' +
      (known ? esc(f.name) : "???") + '<br><span class="stars">' + "★".repeat(RARITY_STARS[f.rarity]) + '</span>' +
      (known ? "<br>🪙 " + f.value : "") + "</div>";
  });
  h += '</div><button class="btn pink" onclick="go(\'pond\')">🎣 Go fish at the pond</button>';
  $("panel").innerHTML = h;
}
function renderLab(){
  let h = "<h2>🧪 Test Lab</h2><p class='small'>Shortcuts for reaching story beats without grinding. The full moon falls on days 7, 15, 23… (day % 8 = 7).</p>";
  h += '<button class="btn" onclick="labDay()">⏭️ Next day (keep weather)</button>';
  h += '<div class="rowbtns">' + Object.keys(WEATHERS).map(w =>
    '<button class="btn" onclick="labWeather(\'' + w + '\')">' + WEATHERS[w][0] + " " + WEATHERS[w][1] + "</button>").join("") + "</div>";
  h += '<button class="btn" onclick="toggleNight()">' + (S.night ? "☀️ Make it day" : "🌙 Make it night") + "</button>";
  h += '<button class="btn" onclick="labMoon()">🌕 Jump to the next full-moon day</button>';
  h += '<button class="btn" onclick="labTheo()">🔭 Theo +100 pts (now ' + S.rel.theo.points + ")</button>";
  h += '<button class="btn" onclick="labFish()">🐟 Give me a random fish</button>';
  h += '<button class="btn" onclick="harvest()">🌱 Simulate a harvest</button>';
  h += '<hr class="sep"><button class="btn rude" onclick="if(confirm(\'Reset the whole tester save?\')){ localStorage.removeItem(\'mm-tester-v1\'); location.reload(); }">🗑️ Reset save</button>';
  $("panel").innerHTML = h;
}
function labDay(){ S.day += 1; S.night = false; save(); render(); }
function labWeather(w){ S.weather = w; if(w === "rainy") momentOnce("firstRain", "First rainy day."); save(); render(); }
function labMoon(){ do { S.day += 1; } while(S.day % 8 !== 7); S.night = true; S.weather = "sunny"; save(); render(); toast("🌕 Full-moon night — Day " + S.day); }
function labTheo(){ gainPoints("theo", Math.ceil(100 / (S.flags.revealDone ? 1 : 0.6))); save(); render(); checkFragments(); }
function labFish(){ const f = DATA.fish[Math.floor(Math.random() * 12)]; addItem("fish-" + f.id, 1); save(); render(); toast("🐟 Added: " + f.name); }
function render(){
  headerRender(); sceneRender();
  if(dlg){ renderDialog(); return; }
  ({places: renderPlaces, people: renderPeople, journal: renderJournal, fish: renderFish, lab: renderLab})[S.tab]();
}
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => {
  S.tab = b.dataset.tab; dlg = null; fishing = null; save(); render();
}));
render();
</script>
</body>
</html>
